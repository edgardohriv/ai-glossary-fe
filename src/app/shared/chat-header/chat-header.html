<header class="shrink-0 h-16 flex items-center gap-3 px-4 md:px-6
               bg-gradient-to-r from-primary-600 to-primary-700
               shadow-md z-10"
        role="banner">
  <!-- Logo / Icon -->
  <div class="flex items-center justify-center w-9 h-9 rounded-xl
              bg-white/15 text-white shrink-0"
       aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
      <line x1="8" y1="6" x2="16" y2="6"/>
      <line x1="8" y1="10" x2="16" y2="10"/>
      <line x1="8" y1="14" x2="12" y2="14"/>
    </svg>
  </div>

  <!-- Title -->
  <div class="min-w-0">
    <h1 class="text-white font-semibold text-base md:text-lg leading-tight truncate">
      Arrivia Document Glossary - {{ modeLabel() }}
    </h1>
    <p class="text-accent-200 text-xs" aria-live="polite">
      @if (isLoading()) { Thinking... } @else { Online }
    </p>
  </div>

  <!-- Feature switch -->
  <a [routerLink]="switchRoute()"
     class="ml-auto shrink-0 inline-flex items-center gap-2 h-9 px-3 md:px-4 rounded-full
            bg-white/15 hover:bg-white/25 active:bg-white/30
            border border-white/25 text-white text-sm font-medium
            transition-colors duration-150
            focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70"
     [attr.aria-label]="'Switch to ' + switchLabel()"
     [title]="'Switch to ' + switchLabel()">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="17 1 21 5 17 9"/>
      <path d="M3 11V9a4 4 0 014-4h14"/>
      <polyline points="7 23 3 19 7 15"/>
      <path d="M21 13v2a4 4 0 01-4 4H3"/>
    </svg>
    <span class="hidden sm:inline whitespace-nowrap">{{ switchLabel() }}</span>
  </a>
</header>
